[project]
name = "naoki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nerd0822", email = "nishantkagra420@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "langchain-chroma>=0.2.2",
    "langchain-core>=0.3.86",
    "langchain-ollama>=0.3.10",
    "langchain-text-splitters>=0.3.11",
    "langgraph>=1.0.1",
    "numpy==1.26.4",
    "onnxruntime>=1.31.0",
    "orjson>=3.13.0",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
naoki = "naoki:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
